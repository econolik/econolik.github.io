function pickWeighted(arr){
  const total = arr.reduce((s,a)=>s+(a.w||a.weight||1),0);
  let r = Math.random()*total;
  for(const a of arr){ r -= (a.w||a.weight||1); if(r<=0) return a; }
  return arr[arr.length-1];
}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

function corr(xs, ys){
  const n=xs.length; if(n<2) return 0;
  const mx=xs.reduce((a,b)=>a+b,0)/n, my=ys.reduce((a,b)=>a+b,0)/n;
  let sxy=0,sxx=0,syy=0;
  for(let i=0;i<n;i++){ const dx=xs[i]-mx, dy=ys[i]-my; sxy+=dx*dy; sxx+=dx*dx; syy+=dy*dy; }
  if(sxx===0||syy===0) return 0;
  return sxy/Math.sqrt(sxx*syy);
}

let _actx = null;

}
function playBell(){
  const a=audio(); if(!a) return; const t=a.currentTime;
  [988, 1319].forEach((f,i)=>{
    const o=a.createOscillator(), g=a.createGain();
    o.type='sine'; o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.09/(i+1), t+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t+0.45);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+0.5);
  });
}

  changeStock(key, d){
    const cost = key==='ice' ? COST_ICE : COST_CUP;
    const fieldY = key==='cups' ? 290 : 352;
    const valueX = W-148-4; // левее кнопки минус, рядом со значением
    if(d>0){ let n=d; while(n>0 && this.money>=cost){ this.inv[key]++; this.money-=cost; this.spentToday+=cost; n--; }
      if(n>0) this.flashFieldHint(valueX, fieldY, '💸 мало денег'); }
    else { let n=-d; while(n>0 && this.inv[key]>0){ this.inv[key]--; this.money+=cost; this.spentToday-=cost; n--; } }
    this.refreshTop(); this.refreshShopTexts();
  }
  // heat = t / HEAT_TEMP, ограничено от 0 (мороз) до 1 (жара). При t < 0 → heat = 0
  // Погода текущего дня с учётом перемешанного порядка
  today(){
    if(!this.dayOrder) return DAYS[0];
    const idx = this.dayOrder[this.dayIndex];
    return (idx !== undefined && DAYS[idx]) ? DAYS[idx] : DAYS[0]; 
  }

  heat(){ 
    const d = this.today();
    if(!d || d.t === undefined) return 0;
    return d.t < 0 ? 0 : clamp(d.t / HEAT_TEMP, 0, 1); 
  }

  ingMaxCups(){ return this.inv.cups; }

  // Базовый поток — только событие (погода НЕ влияет на кол-во посетителей)
  calcBaseFoot(){
    return BASE_FOOT * this.todayEvent.coef;
  }

  // Бросаем кубик ОДИН РАЗ при входе в магазин — диапазон BASE_FOOT*0.8 .. BASE_FOOT*1.2
  rollFootfall(){
    const base = this.calcBaseFoot();
    const noise = 0.8 + Math.random() * 0.4;
    return Math.max(1, Math.round(base * noise));
  }

  // Лёд НЕ влияет на посетителей — только на конверсию (желание купить) в жару
  calcFootWithIce(){ return this.todayFootfall; }
  // Конверсия: цена + погода + лёд (лёд повышает % продаж в жару, не кол-во посетителей)
  convRate(price, iceReady=0){
    const h = this.heat();
    if(isNaN(h) || h === undefined) return 0.5; // защита от NaN
    const weatherBonus = -0.20 + h * 0.35;
    const iceBonus = ICE_BONUS * h * (iceReady||0);
    const result = clamp(1 - PRICE_SLOPE*(price-PRICE_MIN)/(PRICE_MAX-PRICE_MIN) + weatherBonus + iceBonus, MIN_CONV, 1);
    return isNaN(result) ? 0.5 : result;
  }
  autoStock(){
    const day = this.today();
    const base = Math.max(1, Math.round(this.calcBaseFoot()));
    // Лёд: в мороз (t<0) не нужен; иначе — пропорционально heat × base
    const iceTarget = day.t < 0 ? 0 : Math.round(base * this.heat());
    const buy=(key,cost,target)=>{ let n=target-this.inv[key];
      while(n>0 && this.money>=cost){ this.inv[key]++; this.money-=cost; this.spentToday+=cost; n--; } };
    buy('ice', COST_ICE, iceTarget);
    // Стаканы подбираем под зафиксированный поток посетителей
    buy('cups', COST_CUP, this.todayFootfall);
  }
  refreshShopTexts(){
    this.priceText.setText(this.price+' ₸');
    // Показываем зафиксированный поток — он НЕ меняется от цены/льда/стаканов
    this.visValue.setText(this.todayFootfall+' чел.');
    this.cupsText.setText(String(this.inv.cups));
    this.cupsText.setColor(this.inv.cups<=0 ? '#e24b40' : '#4b3f3a');
    this.iceText.setText(String(this.inv.ice));
    this.iceText.setColor('#4b3f3a');
    const day = this.today();
    const baseConv = Math.round(clamp(1 - PRICE_SLOPE*(this.price-PRICE_MIN)/(PRICE_MAX-PRICE_MIN), MIN_CONV, 1) * 100);
    const convPct  = Math.round(this.convRate(this.price) * 100);
    const margin = this.price - COST_CUP;
    let tip;
    if(this.price < COST_CUP)
      tip = '⚠️ Цена ниже себестоимости! Каждый стакан = убыток '+(COST_CUP-this.price)+' ₸';
    else if(convPct === 0)
      tip = '🚫 При такой цене никто не купит — спрос = 0!';
    else if(day.t < 0) tip = '❄️ Мороз — меньше хотят коктейль (−20% к продажам).';
    else if(this.heat() >= 0.7) tip = '🔥 Жара — лёд повышает % покупающих до +30%!';
    else if(this.heat() >= 0.3) tip = '☀️ Тепло — небольшой бонус к конверсии.';
    else tip = '⛅ Прохладно — конверсия чуть ниже нормы.';
    const weatherLine = convPct !== baseConv
      ? ' → с погодой ~'+convPct+'%'
      : '';
    this.hintText.setText(
      'База ~'+baseConv+'%'+weatherLine+' • Маржа: '+margin+' ₸/стакан\n'+tip
    );
  }

  startDay(){
    if(this.ingMaxCups()<=0){ this.flashHint('Наготовь стаканы (и лёд в жару)'); return; }
    this.state='day';
    this.playState = 'play';
    this.time.timeScale = 1; this.tweens.timeScale = 1;
    if(this.pauseBtn) this.pauseBtn.setLabel('2x ускорить');
    const day = this.today();
    this.shopPanel.setVisible(false);
    this.setShopButtons(false);
    this.dayPanel.setVisible(true);
    if(this.pauseBtn) this.pauseBtn.setVisible(true);

    this.footfall = this.calcFootWithIce();
    this.spawnInterval = clamp(DAY_MS/Math.max(1,this.footfall), 350, 3000);

    const h = this.heat();
    const ice = this.inv.ice;
    const iceReady = h > 0 ? clamp(ice / Math.max(1, this.footfall), 0, 1) : 0;
    this.convNow = this.convRate(this.price, iceReady);

    this.dayStartMaxCups = this.ingMaxCups();
    this.refreshTop();

    this.sales=0; this.spawned=0; this.lost=0; this.outCount=0;
    this.spawningDone=false; this.dayStartTime=this.time.now;
    this.updateDayStats();

    this.spawnTimer = this.time.addEvent({delay:this.spawnInterval, loop:true, callback:()=>this.trySpawn()});
    this.serveTimer = this.time.addEvent({delay:SERVE_MS, loop:true, callback:()=>this.serveFront()});
    this.dayEndTimer = this.time.delayedCall(DAY_MS, ()=>{ this.spawningDone=true; });
    this.trySpawn();
    // Перезапускаем болтовню продавца каждый день
    this.time.addEvent({delay:Phaser.Math.Between(2000,5000), loop:false, callback:()=>this.sellerTalk()});
  }

  cyclePlayState(){
    if(!this.playState) this.playState = 'play';
    if(this.playState === 'play'){
      this.playState = '2x';
      this.time.timeScale = 2; this.tweens.timeScale = 2;
      this.pauseBtn.setLabel('⏸ стоп');
    } else if(this.playState === '2x'){
      this.playState = 'pause';
      if(this.spawnTimer) this.spawnTimer.paused = true;
      if(this.serveTimer) this.serveTimer.paused = true;
      this.tweens.pauseAll();
      this.time.timeScale = 1; this.tweens.timeScale = 1;
      this.pauseBtn.setLabel('▶ играть');
    } else {
      this.playState = 'play';
      if(this.spawnTimer) this.spawnTimer.paused = false;
      if(this.serveTimer) this.serveTimer.paused = false;
      this.tweens.resumeAll();
      this.time.timeScale = 1; this.tweens.timeScale = 1;
      this.pauseBtn.setLabel('2x ускорить');
    }
  }
  updateDayStats(){
    const maxRev = this.footfall * this.price;
    if(this.dayStats1) this.dayStats1.setText('Продано: '+this.sales+' из '+this.footfall+' шт');
    if(this.dayStats2) this.dayStats2.setText('Выручка: +'+(this.sales*this.price)+' из '+maxRev+' ₸');
  }

  slotX(i){ return FRONT_X - i*SLOT_GAP_X; }

  makeClient(){
    const color = BODY_COLORS[Phaser.Math.Between(0,BODY_COLORS.length-1)];
    const dark = Phaser.Display.Color.IntegerToColor(color).darken(28).color;
    const c = this.add.container(SPAWN_X, LANE_Y).setDepth(10);
    const sh = this.add.graphics(); sh.fillStyle(0x000000,0.12); sh.fillEllipse(0,36,40,10); c.add(sh);
    const mkLeg=(x)=>{ const l=this.add.rectangle(x,16,8,18,dark).setOrigin(0.5,0); l.setStrokeStyle(2,0x3d3535); return l; };
    const legL=mkLeg(-6), legR=mkLeg(6); c.add([legL,legR]);
    const bd = this.add.graphics(); bd.fillStyle(color,1); bd.fillRoundedRect(-16,-6,32,28,7);
    bd.lineStyle(3,0x3d3535,1); bd.strokeRoundedRect(-16,-6,32,28,7); c.add(bd);
    const hd = this.add.graphics(); hd.fillStyle(0xf5c542,1); hd.fillCircle(0,-22,15);
    hd.lineStyle(3,0x3d3535,1); hd.strokeCircle(0,-22,15); c.add(hd);
    const face = this.add.text(0,-22,'',{fontSize:'24px'}).setOrigin(0.5,0.5); c.add(face);
    const tL=this.tweens.add({targets:legL, angle:{from:-18,to:18}, duration:240, yoyo:true, repeat:-1, ease:'Sine.inOut'});
    const tR=this.tweens.add({targets:legR, angle:{from:18,to:-18}, duration:240, yoyo:true, repeat:-1, ease:'Sine.inOut'});
    c.arrived=false; c.face=face; c.legTweens=[tL,tR];
    return c;
  }
  killClient(c){ if(c.legTweens) c.legTweens.forEach(t=>t.remove()); c.destroy(); }

  trySpawn(){
    if(this.state!=='day' || this.spawningDone) return;
    if(this.spawned>=this.footfall) return;
    if(this.queue.length>=MAX_QUEUE) return;
    const c = this.makeClient();
    this.spawned++;
    const idx = this.queue.length;
    this.queue.push(c);
    this.tweens.add({targets:c, x:this.slotX(idx), y:LANE_Y, duration:700, ease:'Sine.out',
      onComplete:()=>{ c.arrived=true; }});
    this.updateDayStats();
  }

  serveFront(){
    if(this.state!=='day') return;
    if(this.queue.length===0){
      if(this.spawningDone || this.spawned>=this.footfall) this.endDay();
      return;
    }
    const c = this.queue[0];
    if(!c.arrived) return;
    this.queue.shift();

    const buyChance = this.convNow;
    let result;
    if(this.ingMaxCups()<=0){ result='out'; this.lost++; this.outCount++;
      if(this.outCount===1){
        this.sellerSay('Всё! Стаканов нет. Идите домой! 🫙', 4000);
      }
      if(this.outCount>=7 && !this.spawningDone){
        this.spawningDone=true;
        this.time.delayedCall(800,()=>this.endDay());
      }
    }
    else if(Math.random()<buyChance){ result='buy'; this.inv.cups--; if(this.inv.ice>0) this.inv.ice--; this.sales++; this.money+=this.price; }
    else { result='nobuy'; this.lost++; }

    this.refreshTop();
    this.updateDayStats();
    c.arrived=false;
    this.tweens.add({targets:c, x:FRONT_X+10, y:LANE_Y-2, duration:200,
      onComplete:()=>this.resolveClient(c,result)});

    this.queue.forEach((q,i)=>{ q.arrived=false;
      this.tweens.add({targets:q, x:this.slotX(i), duration:260, ease:'Sine.out',
        onComplete:()=>{ q.arrived=true; }}); });
  }

  resolveClient(c, result){
    if(!c.active) return;
    if(result==='buy'){
      c.face.setText('😊'); c.face.setScale(0);
      this.tweens.add({targets:c.face, scale:1, duration:220, ease:'Back.out'});
      this.time.delayedCall(360,()=>{
        if(!c.active) return;
        playClink();
        const cup=this.makeCup(); cup.setPosition(22,4); cup.setScale(0); c.add(cup);
        this.tweens.add({targets:cup, scale:1, duration:220, ease:'Back.out'});
        const phrase = PHRASES_YES[Phaser.Math.Between(0, PHRASES_YES.length-1)];
        const f=this.add.text(c.x-10, c.y-56, phrase, {fontFamily:FONT,fontSize:SZ_B,fontStyle:'700',color:'#1a7a70',backgroundColor:'#e8fff5',padding:{x:5,y:3}}).setOrigin(0.5).setDepth(11);
        this.tweens.add({targets:f, y:f.y-28, alpha:0, duration:900, onComplete:()=>f.destroy()});
      });
      this.time.delayedCall(980,()=>this.walkOff(c));
    } else {
      playNope();
      c.face.setText(result==='out'?'😟':'😕'); c.face.setScale(0);
      this.tweens.add({targets:c.face, scale:1, duration:220, ease:'Back.out'});
      const phrase = result==='out' ? 'нет в наличии' : PHRASES_NO[Phaser.Math.Between(0, PHRASES_NO.length-1)];
      const f=this.add.text(c.x-10, c.y-56, phrase, {fontFamily:FONT,fontSize:SZ_B,fontStyle:'700',color:'#e24b40',backgroundColor:'#fff0f0',padding:{x:5,y:3}}).setOrigin(0.5).setDepth(11);
      this.tweens.add({targets:f, y:f.y-22, alpha:0, duration:900, onComplete:()=>f.destroy()});
      this.time.delayedCall(520,()=>this.walkOff(c));
    }
  }

  walkOff(c){
    if(!c.active) return;
    this.tweens.add({targets:c, x:W+70, duration:1100, ease:'Sine.in', onComplete:()=>this.killClient(c)});
  }

  makeCup(){
    const cup=this.add.container(0,0);
    const g=this.add.graphics();
    g.fillStyle(0xe5483d,1);
    g.beginPath(); g.moveTo(-6,-2); g.lineTo(6,-2); g.lineTo(4,12); g.lineTo(-4,12); g.closePath(); g.fillPath();
    g.lineStyle(1.5,0x3d3535,1); g.strokePath();
    g.fillStyle(0x5fa544,1); g.fillRoundedRect(-7,-6,14,5,2); g.lineStyle(1.5,0x3d3535,1); g.strokeRoundedRect(-7,-6,14,5,2);
    g.lineStyle(2,0x5fa544,1); g.lineBetween(2,-6,5,-15);
    cup.add(g);
    return cup;
  }

  update(){
    if(this.state==='day' && this.playState !== 'pause'){
      const prog = clamp((this.time.now-this.dayStartTime)/DAY_MS,0,1);
      if(this.timeBar){
        this.timeBar.scaleX = Math.max(0.01, 1-prog);
        this.timeBar.fillColor = prog<0.7?0xffd23f:0xff6b5e;
      }
    }
  }

  endDay(){
    if(this.state!=='day') return;
    this.state='summary';
    if(this.spawnTimer) this.spawnTimer.remove();
    if(this.serveTimer) this.serveTimer.remove();
    if(this.dayEndTimer) this.dayEndTimer.remove();
    this.dayPanel.setVisible(false);
    if(this.pauseBtn) this.pauseBtn.setVisible(false);
    this.queue.forEach(c=>{ if(c.legTweens) c.legTweens.forEach(t=>t.remove());
      this.tweens.add({targets:c,alpha:0,y:c.y-20,duration:400,onComplete:()=>c.destroy()}); });
    this.queue=[];

    const revenue = this.sales*this.price;
    const spent = this.spentToday;
    const profit = this.money - this.dayStartMoney;   // выручка − закупка за день
    const iceMelted = this.inv.ice;
    const day = this.today();
    this.history.push({ day:this.dayIndex+1, weather:day.name, price:this.price,
      demand:this.footfall, supply:this.dayStartMaxCups, came:this.spawned, sales:this.sales,
      lost:this.lost, revenue, spent, profit, iceMelted, money:this.money });

    this.inv.ice = 0;   // лёд растаял за ночь
    this.showSummary(revenue, spent, profit, iceMelted);
  }

  victoryFireworks(pop){
    const colors=[0xffd23f,0xff6b5e,0x5fa544,0x4da6ff,0xe05a8a,0xffffff,0xff8c2b];
    const burst=(bx,by,delay)=>{
      this.time.delayedCall(delay,()=>{
        for(let i=0;i<20;i++){
          const p=this.add.graphics().setDepth(95);
          const col=colors[Phaser.Math.Between(0,colors.length-1)];
          p.fillStyle(col,1); p.fillCircle(0,0,Phaser.Math.Between(3,6));
          p.setPosition(bx,by);
          const angle=Math.random()*Math.PI*2;
          const spd=Phaser.Math.Between(60,180);
          this.tweens.add({targets:p,
            x:bx+Math.cos(angle)*spd, y:by+Math.sin(angle)*spd,
            alpha:0, scaleX:0.2, scaleY:0.2,
            duration:Phaser.Math.Between(600,1000), ease:'Sine.out',
            onComplete:()=>p.destroy()});
        }
        const emoji=['🎆','✨','🌟','💫'][Phaser.Math.Between(0,3)];
        const e=this.add.text(bx,by,emoji,{fontSize:'28px'}).setOrigin(0.5).setDepth(95);
        this.tweens.add({targets:e,y:by-60,alpha:0,duration:900,onComplete:()=>e.destroy()});
      });
    };
    burst(80,  H/2-420, 0);
    burst(W-80,H/2-420, 200);
    burst(W/2, H/2-500, 400);
    burst(60,  H/2-320, 700);
    burst(W-60,H/2-320, 900);
    burst(W/2, H/2-380, 1100);
  }

  fireworks(){
    const colors=[0xffd23f,0xff6b5e,0x5fa544,0x4da6ff,0xe05a8a,0xffffff];
    const burst=(bx,by,delay)=>{
      this.time.delayedCall(delay,()=>{
        if(this.state!=='summary') return;
        const col=colors[Phaser.Math.Between(0,colors.length-1)];
        for(let i=0;i<16;i++){
          const ang=(i/16)*Math.PI*2, sp=Phaser.Math.Between(45,95);
          const p=this.add.circle(bx,by,4,col).setDepth(60);
          this.tweens.add({targets:p, x:bx+Math.cos(ang)*sp, y:by+Math.sin(ang)*sp+20,
            alpha:0, scale:0.2, duration:Phaser.Math.Between(750,1050), ease:'Quad.out',
            onComplete:()=>p.destroy()});
        }
      });
    };
    for(let k=0;k<6;k++) burst(Phaser.Math.Between(110,370), Phaser.Math.Between(180,360), k*330);
  }

  drawPriceAnalysis(){
    const L = this.priceLayer;
    const h = this.history;
    if(!h || h.length===0) return;

    L.add(this.add.rectangle(W/2,H/2,W,H,0x1c1722,0.72));
    L.add(roundRect(this,18,48,W-36,760,22,0xfff4e0,1));
    L.add(this.add.text(W/2,68,'💡 Анализ цены',{fontFamily:FONT,fontSize:SZ_S,fontStyle:'700',color:COL.ink}).setOrigin(0.5));
    L.add(this.add.text(W/2,94,'Ваша цена vs оптимум по погоде',{fontFamily:FONT_TEXT,fontSize:'14px',color:COL.sub}).setOrigin(0.5));

    // --- График ---
    const px0=60, px1=428, pyTop=124, pyBot=204;
    const X=p=> px0 + (p-PRICE_MIN)/(PRICE_MAX-PRICE_MIN)*(px1-px0);
    const profitMax = 500;
    const Y=v=> pyBot - clamp(v,0,profitMax)/profitMax*(pyBot-pyTop);

    const ax=this.add.graphics(); L.add(ax);
    ax.lineStyle(1,0xe0d4b8,1);
    [0,100,200,300,400,500].forEach(v=>ax.lineBetween(px0,Y(v),px1,Y(v)));
    [30,50,70,90].forEach(p=>ax.lineBetween(X(p),pyTop,X(p),pyBot));
    ax.lineStyle(2,0x2b2330,1);
    ax.lineBetween(px0,pyTop,px0,pyBot);
    ax.lineBetween(px0,pyBot,px1,pyBot);
    [30,50,70,90].forEach(p=>L.add(this.add.text(X(p),pyBot+5,p+'₸',{fontFamily:FONT_TEXT,fontSize:'14px',color:COL.sub}).setOrigin(0.5,0)));
    [0,250,500].forEach(v=>L.add(this.add.text(px0-5,Y(v),v+'₸',{fontFamily:FONT_TEXT,fontSize:'14px',color:COL.sub}).setOrigin(1,0.5)));
    L.add(this.add.text(px0-18,(pyTop+pyBot)/2,'прибыль',{fontFamily:FONT_TEXT,fontSize:'14px',color:COL.sub}).setOrigin(0.5).setAngle(-90));
    L.add(this.add.text((px0+px1)/2,pyBot+16,'цена за стакан',{fontFamily:FONT_TEXT,fontSize:'14px',color:COL.sub}).setOrigin(0.5));

    // Кривая прибыли для каждого дня (по реальной погоде + событию того дня)
    const dayColors=[0x3a7ce0,0x5fa544,0xe8915a,0xe05a8a,0xff6b5e];
    const optPrices=[];
    h.forEach((d,di)=>{
      const dayData = DAYS[this.dayOrder[di]];
      const heat = dayData.t<0?0:clamp(dayData.t/HEAT_TEMP,0,1);
      const wBonus = -0.20 + heat*0.35;
      // прибыль при цене P = продано × (P − COST_CUP), продано = посетители × конверсия
      const visitors = d.demand;
      const profitAt = P => {
        const conv = clamp(1 - PRICE_SLOPE*(P-PRICE_MIN)/(PRICE_MAX-PRICE_MIN) + wBonus, MIN_CONV, 1);
        const sold = Math.min(d.supply, Math.round(visitors*conv));
        return sold * (P - COST_CUP);
      };
      // Найти оптимальную цену
      let bestP=PRICE_MIN, bestPr=-Infinity;
      for(let P=PRICE_MIN;P<=PRICE_MAX;P+=1){ const pr=profitAt(P); if(pr>bestPr){bestPr=pr;bestP=P;} }
      optPrices.push({p:bestP, pr:bestPr});

      const col=dayColors[di];
      const g=this.add.graphics(); L.add(g);
      g.lineStyle(2.5,col,0.8); g.beginPath();
      for(let P=PRICE_MIN,f=1;P<=PRICE_MAX;P+=1,f=0){
        const y=Y(profitAt(P)); f?g.moveTo(X(P),y):g.lineTo(X(P),y);
      }
      g.strokePath();
      // оптимум — точка
      g.fillStyle(col,1); g.fillCircle(X(bestP),Y(bestPr),5);
      // фактическая цена — вертикальная метка
      const myPr=profitAt(d.price);
      g.fillStyle(0xffffff,1); g.fillCircle(X(d.price),Y(myPr),4);
      g.lineStyle(2,col,1); g.strokeCircle(X(d.price),Y(myPr),4);
    });

    // Легенда дней
    let lx=px0; const lyy=100;
    h.forEach((d,di)=>{
      const col=dayColors[di];
      const sq=this.add.graphics(); sq.fillStyle(col,1); sq.fillRoundedRect(lx,lyy-5,10,10,3); L.add(sq);
      L.add(this.add.text(lx+13,lyy,'Д'+(di+1),{fontFamily:FONT_TEXT,fontSize:'14px',fontStyle:'700',color:COL.ink}).setOrigin(0,0.5));
      lx+=34;
    });
    const lg2=this.add.graphics();
    lg2.fillStyle(0x2b2330,1); lg2.fillCircle(px1-44,lyy,4); L.add(lg2);
    L.add(this.add.text(px1-38,lyy,'оптимум',{fontFamily:FONT_TEXT,fontSize:'14px',color:COL.ink}).setOrigin(0,0.5));
    const lg3=this.add.graphics();
    lg3.lineStyle(2,0x888,1); lg3.strokeCircle(px1+18,lyy,3); L.add(lg3);
    L.add(this.add.text(px1+24,lyy,'Ваша',{fontFamily:FONT_TEXT,fontSize:'14px',color:COL.ink}).setOrigin(0,0.5));

    // --- Таблица по дням ---
    const tblY = pyBot + 44;
    L.add(roundRect(this,26,tblY,W-52,h.length*32+80,14,0xfbe9c8,1));
    L.add(this.add.text(W/2,tblY+14,'По дням: Ваша цена vs оптимум',{fontFamily:FONT_TEXT,fontSize:'14px',fontStyle:'700',color:COL.ink}).setOrigin(0.5));
    const cols=[30,88,184,298,414];
    const hdrs=['День','Погода','Моя ₸→прибыль','Опт. ₸→прибыль','Δ'];
    hdrs.forEach((hd,i)=>L.add(this.add.text(cols[i],tblY+38,hd,{fontFamily:FONT_TEXT,fontSize:'14px',fontStyle:'700',color:COL.sub}).setOrigin(0,0.5)));

    let totalLost=0;
    h.forEach((d,di)=>{
      const ry=tblY+58+di*32;
      const opt=optPrices[di];
      const dayData=DAYS[this.dayOrder[di]];
      const heatV=dayData.t<0?0:clamp(dayData.t/HEAT_TEMP,0,1);
      const wBonus=-0.20+heatV*0.35;
      const myConv=clamp(1-PRICE_SLOPE*(d.price-PRICE_MIN)/(PRICE_MAX-PRICE_MIN)+wBonus,MIN_CONV,1);
      const mySold=Math.min(d.supply,Math.round(d.demand*myConv));
      const myPr=mySold*(d.price-COST_CUP);
      const lost=Math.round(opt.pr-myPr);
      totalLost+=Math.max(0,lost);

      const col=dayColors[di];
      const sq=this.add.graphics(); sq.fillStyle(col,1); sq.fillRoundedRect(cols[0],ry-6,9,12,3); L.add(sq);
      L.add(this.add.text(cols[0]+12,ry,'Д'+(di+1),{fontFamily:FONT_TEXT,fontSize:'14px',fontStyle:'700',color:COL.ink}).setOrigin(0,0.5));
      L.add(this.add.text(cols[1],ry,dayData.icon+' '+dayData.name.slice(0,6),{fontFamily:FONT_TEXT,fontSize:'14px',color:COL.ink}).setOrigin(0,0.5));
      L.add(this.add.text(cols[2],ry,d.price+'₸→+'+myPr+'₸',{fontFamily:FONT_TEXT,fontSize:'14px',color:COL.ink}).setOrigin(0,0.5));
      L.add(this.add.text(cols[3],ry,opt.p+'₸→+'+Math.round(opt.pr)+'₸',{fontFamily:FONT_TEXT,fontSize:'14px',color:'#1a7a70'}).setOrigin(0,0.5));
      const lostCol = lost>0?'#e24b40':'#1a7a70';
      L.add(this.add.text(cols[4],ry,(lost>0?'−'+lost:'✓'),{fontFamily:FONT_TEXT,fontSize:'14px',fontStyle:'700',color:lostCol}).setOrigin(0,0.5));
    });
    const totalY=tblY+58+h.length*32;
    L.add(this.add.text(cols[3],totalY,'Итого:',{fontFamily:FONT_TEXT,fontSize:'14px',fontStyle:'700',color:COL.ink}).setOrigin(0,0.5));
    L.add(this.add.text(cols[4],totalY,totalLost>0?'−'+totalLost:'✓',{fontFamily:FONT_TEXT,fontSize:'14px',fontStyle:'700',color:totalLost>0?'#e24b40':'#1a7a70'}).setOrigin(0,0.5));

    // --- Вывод текстом ---
    const txtY = totalY + 26;
    L.add(roundRect(this,26,txtY,W-52,130,14,0xfff4e0,1));
    const lines=[];
    // Анализ по каждому дню отдельно (средняя цена не информативна при разных условиях)
    h.forEach((d,di)=>{
      const opt=optPrices[di];
      const diff=d.price-opt.p;
      if(Math.abs(diff)<=5)
        lines.push('Д'+(di+1)+' ('+DAYS[this.dayOrder[di]].name+'): цена '+d.price+'₸ близка к оптимуму '+opt.p+'₸ ✓');
      else if(diff>5)
        lines.push('Д'+(di+1)+' ('+DAYS[this.dayOrder[di]].name+'): цена '+d.price+'₸ выше оптимума '+opt.p+'₸ — теряла покупателей.');
      else
        lines.push('Д'+(di+1)+' ('+DAYS[this.dayOrder[di]].name+'): цена '+d.price+'₸ ниже оптимума '+opt.p+'₸ — теряла маржу.');
    });
    lines.push('Оптимальная цена меняется каждый день: жара → выше, мороз → ниже.');
    L.add(this.add.text(40,txtY+12,lines.join('\n'),{fontFamily:FONT_TEXT,fontSize:'14px',color:COL.ink,lineSpacing:5,wordWrap:{width:W-90}}));
  }

  drawReport(){
    const L=this.reportLayer, h=this.history;
    const curDay = h[h.length-1]; // только последний день
    const isLast = h.length === DAYS.length;
    const dayLabel = isLast ? 'Итог 5/5 дней' : 'День '+h.length+'/'+DAYS.length;

    L.add(this.add.rectangle(W/2,H/2,W,H,0x1c1722,0.62));
    L.add(roundRect(this,24,60,W-48,632,24,0xfff4e0,1));
    L.add(this.add.text(W/2,84,'Спрос и предложение',{fontFamily:FONT,fontSize:SZ_H,fontStyle:'700',color:COL.ink}).setOrigin(0.5));
    L.add(this.add.text(W/2,116,dayLabel+' • крест рынка + Ваши продажи',{fontFamily:FONT_TEXT,fontSize:SZ_B,color:COL.sub}).setOrigin(0.5));

    // --- нейтральная конверсия (только цена) ---
    const convNeutral = P => clamp(1 - PRICE_SLOPE*(P-PRICE_MIN)/(PRICE_MAX-PRICE_MIN), MIN_CONV, 1);
    const footAvg = BASE_FOOT; // посетители не зависят от погоды
    const Qd = P => footAvg * convNeutral(P);
    const cost = COST_CUP;
    const supply = curDay.supply;
    const Qs = P => Math.max(0, supply*(P-cost)/(BASE_PRICE-cost));
    const Qmax = Math.max(10, Math.ceil(Math.max(Qd(PRICE_MIN), supply, 40)/10)*10);
    let Peq=PRICE_MIN, best=Infinity;
    for(let P=PRICE_MIN;P<=PRICE_MAX;P+=0.5){ const diff=Math.abs(Qd(P)-Qs(P)); if(diff<best){best=diff;Peq=P;} }
    const Qeq=(Qd(Peq)+Qs(Peq))/2;

    // --- область графика ---
    const px0=78, px1=438, pyTop=194, pyBot=424;
    const X=q=> px0 + clamp(q,0,Qmax)/Qmax*(px1-px0);
    const Y=p=> pyBot - (p-PRICE_MIN)/(PRICE_MAX-PRICE_MIN)*(pyBot-pyTop);

    // легенда
    const leg=[['Спрос',0xff8c2b],['Предложение',0x2ec4b6],['Продажи',0xff5470]];
    let lx=58; const lyy=158;
    leg.forEach(it=>{ const sq=this.add.graphics(); sq.fillStyle(it[1],1); sq.fillRoundedRect(lx,lyy-7,14,14,3); L.add(sq);
      L.add(this.add.text(lx+19,lyy,it[0],{fontFamily:FONT_TEXT,fontSize:SZ_B,fontStyle:'600',color:COL.ink}).setOrigin(0,0.5));
      lx += 30 + it[0].length*8.5; });

    // сетка и оси
    const ax=this.add.graphics(); L.add(ax);
    ax.lineStyle(1,0xeaddc0,1);
    for(let p=PRICE_MIN;p<=PRICE_MAX;p+=10){ const y=Y(p); ax.lineBetween(px0,y,px1,y); }
    for(let q=0;q<=Qmax;q+=Qmax/4){ const x=X(q); ax.lineBetween(x,pyTop,x,pyBot); }
    ax.lineStyle(2.5,0x2b2330,1);
    ax.lineBetween(px0,pyTop,px0,pyBot);
    ax.lineBetween(px0,pyBot,px1,pyBot);
    for(let p=PRICE_MIN;p<=PRICE_MAX;p+=20) L.add(this.add.text(px0-8,Y(p),String(p),{fontFamily:FONT_TEXT,fontSize:SZ_B,color:COL.sub}).setOrigin(1,0.5));
    for(let q=0;q<=Qmax;q+=Qmax/2) L.add(this.add.text(X(q),pyBot+7,String(Math.round(q)),{fontFamily:FONT_TEXT,fontSize:SZ_B,color:COL.sub}).setOrigin(0.5,0));
    L.add(this.add.text((px0+px1)/2,pyBot+26,'Количество, шт',{fontFamily:FONT_TEXT,fontSize:SZ_B,fontStyle:'600',color:COL.sub}).setOrigin(0.5));
    const yl=this.add.text(38,(pyTop+pyBot)/2,'Цена, ₸',{fontFamily:FONT_TEXT,fontSize:SZ_B,fontStyle:'600',color:COL.sub}).setOrigin(0.5).setAngle(-90); L.add(yl);

    // кривые
    const dg=this.add.graphics(); L.add(dg); dg.lineStyle(4,0xff8c2b,1); dg.beginPath();
    for(let p=PRICE_MIN,f=1;p<=PRICE_MAX;p+=2,f=0){ const x=X(Qd(p)),y=Y(p); f?dg.moveTo(x,y):dg.lineTo(x,y); } dg.strokePath();
    const sg=this.add.graphics(); L.add(sg); sg.lineStyle(4,0x2ec4b6,1);
    sg.lineBetween(X(Qs(PRICE_MIN)),Y(PRICE_MIN),X(Qs(PRICE_MAX)),Y(PRICE_MAX));

    // точка равновесия
    const ex=X(Qeq), ey=Y(Peq), eg=this.add.graphics(); L.add(eg);
    eg.lineStyle(1.5,0x9a8fa0,1); eg.lineBetween(px0,ey,ex,ey); eg.lineBetween(ex,ey,ex,pyBot);
    eg.fillStyle(0x2b2330,1); eg.fillCircle(ex,ey,6);
    L.add(this.add.text(ex+(ex>px0+(px1-px0)*0.55?-10:10), ey-16, 'равновесие ≈'+Math.round(Peq)+'₸',
      {fontFamily:FONT_TEXT,fontSize:SZ_B,fontStyle:'700',color:COL.ink}).setOrigin(ex>px0+(px1-px0)*0.55?1:0,0.5));

    // ТОЛЬКО ОДНА точка — текущий день
    const px=X(curDay.sales), py=Y(curDay.price);
    const pg=this.add.graphics(); L.add(pg);
    pg.fillStyle(0xffffff,1); pg.fillCircle(px,py,8);
    pg.fillStyle(0xff5470,1); pg.fillCircle(px,py,6);
    L.add(this.add.text(px,py-18,'Д'+curDay.day,{fontFamily:FONT_TEXT,fontSize:SZ_B,fontStyle:'700',color:COL.ink}).setOrigin(0.5));

    // если финальный отчёт — показываем все 5 точек
    if(isLast){
      const lgp=this.add.graphics(); L.add(lgp); lgp.lineStyle(2,0x2b2330,0.5); lgp.beginPath();
      h.forEach((d,i)=>{ const x=X(d.sales),y=Y(d.price); i?lgp.lineTo(x,y):lgp.moveTo(x,y); }); lgp.strokePath();
      h.forEach((d,i)=>{
        if(i===h.length-1) return; // последнюю уже нарисовали крупнее
        const x=X(d.sales),y=Y(d.price);
        lgp.fillStyle(0xffffff,1); lgp.fillCircle(x,y,6); lgp.fillStyle(0xff5470,0.6); lgp.fillCircle(x,y,4);
        L.add(this.add.text(x,y-14,'Д'+d.day,{fontFamily:FONT_TEXT,fontSize:SZ_B,color:COL.sub}).setOrigin(0.5));
      });
    }

    // выводы
    L.add(roundRect(this,40,446,W-80,232,16,0xfbe9c8,1));
    const Pavg = isLast ? Math.round(h.reduce((a,d)=>a+d.price,0)/h.length) : curDay.price;
    const lines=[
      'Равновесие ≈'+Math.round(Peq)+'₸ — цена, где спрос = предложению.',
      ''
    ];
    if(!isLast){
      if(curDay.price < COST_CUP) lines.push('Цена '+curDay.price+'₸ ниже себестоимости '+COST_CUP+'₸ — каждая продажа приносила убыток!');
      else if(curDay.price < Peq-5) lines.push('Цена '+curDay.price+'₸ ниже равновесной. Покупали охотно, но маржа маленькая.');
      else if(curDay.price > Peq+5) lines.push('Сегодня цена '+curDay.price+'₸ выше равновесной. Маржа хорошая, но часть ушла без покупки.');
      else lines.push('Сегодня цена '+curDay.price+'₸ близко к равновесию — хороший баланс!');
    } else {
      // финальный анализ за 5 дней
      lines.push('Средняя цена за 5 дней: '+Pavg+'₸. Равновесие ≈'+Math.round(Peq)+'₸.');
      const cheap=h.filter(d=>d.price<Peq-5), dear=h.filter(d=>d.price>Peq+5 && (d.came-d.sales)>3), ok=h.filter(d=>Math.abs(d.price-Peq)<=5 || (d.came-d.sales)<=3);
      if(ok.length) lines.push('✓ Дни '+ok.map(d=>'Д'+d.day).join(',')+': цена у равновесия — оптимально.');
      if(cheap.length) lines.push('↓ Дни '+cheap.map(d=>'Д'+d.day).join(',')+': цена занижена — теряла маржу.');
      if(dear.length) lines.push('↑ Дни '+dear.map(d=>'Д'+d.day).join(',')+': цена завышена — уходили без покупки.');
      const avgLost=Math.round(h.reduce((a,d)=>a+(d.came-d.sales),0)/h.length);
      lines.push('В среднем уходило без покупки: '+avgLost+' чел./день. Подними цену в жаркие дни, снизь в мороз.');
    }
    L.add(this.add.text(56,462,lines.join('\n'),{fontFamily:FONT,fontSize:SZ_B,color:COL.ink,lineSpacing:6,wordWrap:{width:W-112}}));
  }

    this.state='sandbox';
    this.shopPanel.setVisible(false); this.setShopButtons(false);
    this.sandboxButtons.forEach(b=>b.destroy()); this.sandboxButtons=[];
    this.sandboxLayer.removeAll(true);
    this.sandboxLayer.setVisible(true);

    // Подтягиваем реальные параметры текущего дня
    this.sb.cost  = COST_CUP;
    this.sb.foot  = this.todayFootfall;
    this.sb.price = this.price;
    const L=this.sandboxLayer;
    L.add(this.add.rectangle(W/2,H/2,W,H,0x1c1722,0.62));
    L.add(roundRect(this,24,52,W-48,790,22,0xfff4e0,1));
    L.add(this.add.text(W/2,82,'Песочница рынка',{fontFamily:FONT,fontSize:SZ_H,fontStyle:'700',color:COL.ink}).setOrigin(0.5));
    L.add(this.add.text(W/2,106,'меняй параметры — смотри, как двигается равновесие',{fontFamily:FONT_TEXT,fontSize:SZ_B,color:COL.sub}).setOrigin(0.5));

    this.sbChart=this.add.container(0,0); L.add(this.sbChart);

    L.add(this.add.text(48,318,'Себестоимость',{fontFamily:FONT_TEXT,fontSize:SZ_S,fontStyle:'600',color:COL.ink}).setOrigin(0,0.5));
    L.add(this.add.text(48,358,'Посетителей',{fontFamily:FONT_TEXT,fontSize:SZ_S,fontStyle:'600',color:COL.ink}).setOrigin(0,0.5));
    L.add(this.add.text(48,398,'Твоя цена',{fontFamily:FONT_TEXT,fontSize:SZ_S,fontStyle:'600',color:COL.ink}).setOrigin(0,0.5));
    L.add(this.add.text(300,298,'(сегодня: '+this.todayFootfall+' чел.)',{fontFamily:FONT_TEXT,fontSize:SZ_B,color:COL.sub}).setOrigin(0,1));
    this.sbCostT=this.add.text(366,318,'',{fontFamily:FONT_TEXT,fontSize:SZ_S,fontStyle:'700',color:COL.ink}).setOrigin(0.5); L.add(this.sbCostT);
    this.sbFootT=this.add.text(366,358,'',{fontFamily:FONT_TEXT,fontSize:SZ_S,fontStyle:'700',color:COL.ink}).setOrigin(0.5); L.add(this.sbFootT);
    this.sbPriceT=this.add.text(366,398,'',{fontFamily:FONT_TEXT,fontSize:SZ_S,fontStyle:'700',color:COL.ink}).setOrigin(0.5); L.add(this.sbPriceT);

    L.add(roundRect(this,40,432,W-80,310,14,0xfbe9c8,1));
    this.sbReadout=this.add.text(56,446,'',{fontFamily:FONT_TEXT,fontSize:SZ_B,color:COL.ink,lineSpacing:6,wordWrap:{width:W-112}}); L.add(this.sbReadout);

    const mk=(x,y,lbl,col,fn)=>{ const t=this.add.text(0,0,lbl,{fontFamily:FONT_TEXT,fontSize:SZ_H,fontStyle:'700',color:col}).setOrigin(0.5); const c=this.add.container(x,y,[t]).setDepth(this.sandboxLayer.depth+1); c.setSize(44,44); c._fn=fn; this.sandboxButtons.push(c); };
    mk(316,318,'–','#ff6b5e',()=>this.changeSb('cost',-5));
    mk(416,318,'+','#2ec4b6',()=>this.changeSb('cost',5));
    mk(316,358,'–','#ff6b5e',()=>this.changeSb('foot',-5));
    mk(416,358,'+','#2ec4b6',()=>this.changeSb('foot',5));
    mk(316,398,'–','#ff6b5e',()=>this.changeSb('price',-5));
    mk(416,398,'+','#2ec4b6',()=>this.changeSb('price',5));
    this.sandboxButtons.push(mkInto(this,this.sandboxLayer,W/2,812,200,46,'Закрыть',0xffd23f,'#2b2330',()=>this.closeSandbox()));
    this.drawSandbox();
  }

  changeSb(key,delta){
    if(key==='cost') this.sb.cost=clamp(this.sb.cost+delta,10,40);
    else if(key==='foot') this.sb.foot=clamp(this.sb.foot+delta,10,80);
    else this.sb.price=clamp(this.sb.price+delta,PRICE_MIN,PRICE_MAX);
    this.drawSandbox();
  }

  drawSandbox(){
    const C=this.sbChart, sb=this.sb, Qmax=80; C.removeAll(true);
    // В песочнице конверсия нейтральная (без погодного бонуса) — только цена
    const convNeutral=P=> clamp(1 - PRICE_SLOPE*(P-PRICE_MIN)/(PRICE_MAX-PRICE_MIN), MIN_CONV, 1);
    const Qd=P=> sb.foot*convNeutral(P);
    const kS=Qmax/(PRICE_MAX-sb.cost);
    const Qs=P=> Math.max(0,kS*(P-sb.cost));
    let Peq=PRICE_MIN,best=Infinity;
    for(let P=PRICE_MIN;P<=PRICE_MAX;P+=0.5){const d=Math.abs(Qd(P)-Qs(P)); if(d<best){best=d;Peq=P;}}
    const Qeq=(Qd(Peq)+Qs(Peq))/2;

    const px0=76,px1=440,pyTop=148,pyBot=248;  // высота графика 100px вместо 200
    const X=q=>px0+clamp(q,0,Qmax)/Qmax*(px1-px0);
    const Y=p=>pyBot-(p-PRICE_MIN)/(PRICE_MAX-PRICE_MIN)*(pyBot-pyTop);

    const g=this.add.graphics(); C.add(g);
    g.lineStyle(1,0xeaddc0,1);
    for(let p=PRICE_MIN;p<=PRICE_MAX;p+=10) g.lineBetween(px0,Y(p),px1,Y(p));
    g.lineStyle(2.5,0x2b2330,1); g.lineBetween(px0,pyTop,px0,pyBot); g.lineBetween(px0,pyBot,px1,pyBot);
    for(let p=PRICE_MIN;p<=PRICE_MAX;p+=20) C.add(this.add.text(px0-8,Y(p),String(p),{fontFamily:FONT_TEXT,fontSize:SZ_B,color:COL.sub}).setOrigin(1,0.5));
    C.add(this.add.text((px0+px1)/2,pyBot+22,'Количество, шт',{fontFamily:FONT_TEXT,fontSize:SZ_B,fontStyle:'600',color:COL.sub}).setOrigin(0.5));
    const yl=this.add.text(38,(pyTop+pyBot)/2,'Цена, ₸',{fontFamily:FONT_TEXT,fontSize:SZ_B,fontStyle:'600',color:COL.sub}).setOrigin(0.5).setAngle(-90); C.add(yl);

    const dg=this.add.graphics(); C.add(dg); dg.lineStyle(4,0xff8c2b,1); dg.beginPath();
    for(let p=PRICE_MIN,f=1;p<=PRICE_MAX;p+=2,f=0){const x=X(Qd(p)),y=Y(p); f?dg.moveTo(x,y):dg.lineTo(x,y);} dg.strokePath();
    const sg=this.add.graphics(); C.add(sg); sg.lineStyle(4,0x2ec4b6,1);
    sg.lineBetween(X(Qs(PRICE_MIN)),Y(PRICE_MIN),X(Qs(PRICE_MAX)),Y(PRICE_MAX));

    const ex=X(Qeq),ey=Y(Peq),eg=this.add.graphics(); C.add(eg);
    eg.lineStyle(1.5,0x9a8fa0,1); eg.lineBetween(px0,ey,ex,ey); eg.lineBetween(ex,ey,ex,pyBot);
    eg.fillStyle(0x2b2330,1); eg.fillCircle(ex,ey,6);

    const qd=Qd(sb.price), qs=Qs(sb.price), sales=Math.min(qd,qs), py=Y(sb.price);
    const pm=this.add.graphics(); C.add(pm);
    pm.lineStyle(2,0xff5470,0.9); pm.lineBetween(px0,py,px1,py);
    pm.fillStyle(0xff8c2b,1); pm.fillCircle(X(qd),py,5);
    pm.fillStyle(0x2ec4b6,1); pm.fillCircle(X(qs),py,5);

    this.sbCostT.setText(sb.cost+' ₸');
    this.sbFootT.setText(String(sb.foot));
    this.sbPriceT.setText(sb.price+' ₸');
    let note;
    if(qd>qs+1) note='дефицит: раскупят весь запас, будет очередь.';
    else if(qs>qd+1) note='избыток: часть стаканов не продастся.';
    else note='баланс: спрос ≈ предложение.';

    const convAtPrice = Math.round(clamp(1 - PRICE_SLOPE*(sb.price-PRICE_MIN)/(PRICE_MAX-PRICE_MIN), MIN_CONV, 1)*100);
    const h = this.heat();
    const ice = this.inv ? this.inv.ice : 0;
    const iceReady = h > 0 ? clamp(ice / Math.max(1, this.todayFootfall||1), 0, 1) : 0;
    const weatherBonus = Math.round((-0.20 + h*0.35)*100);
    const iceBonus = Math.round(ICE_BONUS * h * iceReady * 100);
    // convNow может быть undefined если день ещё не начался — считаем сами
    const realConvPct = this.convNow && !isNaN(this.convNow)
      ? Math.round(this.convNow * 100)
      : Math.round(clamp(1 - PRICE_SLOPE*(this.price-PRICE_MIN)/(PRICE_MAX-PRICE_MIN) + (-0.20+h*0.35) + ICE_BONUS*h*iceReady, MIN_CONV, 1)*100);

    const todayDone = this.history.length > 0 && this.history[this.history.length-1].day === this.dayIndex+1;
    let realNote = '';
    if(todayDone){
      const realSales = this.history[this.history.length-1].sales;
      realNote = realSales > Math.round(qd)
        ? '\n📊 Факт сегодня: продано '+realSales+' шт — больше плана!\nПогода и лёд подняли конверсию до ~'+realConvPct+'% вместо базовых ~'+convAtPrice+'%.'
        : '\n📊 Факт сегодня: продано '+realSales+' шт (конверсия с погодой ~'+realConvPct+'%).';
    }

    const weatherNote = weatherBonus >= 0 ? 'погода даёт +'+weatherBonus+'%' : 'погода даёт '+weatherBonus+'%';
    const iceNote = iceBonus > 0 ? ', лёд +'+iceBonus+'%' : '';
    const convNote = '⚖️ Базовая конверсия ~'+convAtPrice+'% (только цена).\n'+
      '🌤️ В подготовке к смене: '+weatherNote+iceNote+' → итого ~'+realConvPct+'%.\n'+
      'Равновесие ≈'+Math.round(Peq)+'₸. Считается без погоды/льда — это теоретический рынок.';

    this.sbReadout.setText(
      'Базовый план (без погоды/льда): из '+sb.foot+' посетителей при цене '+sb.price+'₸\n'+
      'хотят купить ~'+convAtPrice+'% → ≈'+Math.round(qd)+' чел. Равновесие ≈'+Math.round(Peq)+'₸.\n'+
      '→ продажи по модели ≈'+Math.round(sales)+' шт — '+note+'\n'+
      convNote + realNote
    );
  }

  closeSandbox(){
    this.sandboxLayer.removeAll(true);
    this.sandboxButtons.forEach(b=>b.destroy()); this.sandboxButtons=[];
    this.sandboxLayer.setVisible(false);
    this.resumeShop();
  }
}

const game = new Phaser.Game({
  type: Phaser.AUTO,
  backgroundColor: '#1c1722',
  scale: {
    mode: Phaser.Scale.FIT,
    autoCenter: Phaser.Scale.CENTER_BOTH,
    width: W,
    height: H,
    parent: 'game',
  },
  scene: MainScene,
});

// Патч input: пересчитываем координаты тапа с учётом реального масштаба canvas
game.events.once('ready', () => {
  const mgr = game.input;
  mgr.transformPointer = function(pointer, pageX, pageY, wasMove) {
    const canvas = game.canvas;
    const rect = canvas.getBoundingClientRect();
    const scaleX = W / rect.width;
    const scaleY = H / rect.height;
    const x = (pageX - rect.left) * scaleX;
    const y = (pageY - rect.top) * scaleY;
    pointer.x = x;
    pointer.y = y;
    pointer.worldX = x;
    pointer.worldY = y;
  };
});

// пересчёт размеров/границ холста — чтобы тапы на планшете попадали точно
function refit(){
  if(!game || !game.scale) return;
  setTimeout(()=>{
    game.scale.refresh();
    // На десктопе canvas ограничен CSS max-height/max-width — нужно сообщить Phaser реальный размер
    const canvas = document.querySelector('canvas');
    if(canvas){
      const rect = canvas.getBoundingClientRect();
      if(rect.width > 0) game.scale.refresh();
    }
  }, 100);
}
window.addEventListener('resize', refit);
window.addEventListener('orientationchange', ()=>setTimeout(refit, 300));
window.addEventListener('focus', refit);
window.addEventListener('load', ()=>setTimeout(refit, 200));
if(CSS && CSS.supports && CSS.supports('height','100dvh')){
  document.documentElement.style.height='100dvh';
  document.body.style.height='100dvh';
}
